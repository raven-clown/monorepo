name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build --workspace=@snippet/core

      # electron-builder (nsis-web target) produces both the small installer
      # exe and the electron-app-${version}-x64.nsis.7z package. electron-updater
      # needs these published even though end users no longer download them
      # directly - it's what powers the in-app silent auto-update.
      - name: Build and publish electron-app (nsis-web, powers auto-update)
        run: npm run build --workspace=electron-app -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build unpacked electron-app payload for the custom installer
        run: npm run build:unpacked --workspace=electron-app

      # The custom-branded installer is what users actually download from
      # GitHub Releases; it bundles the unpacked app built above.
      - name: Build and publish the custom installer
        run: npm run build --workspace=installer -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
